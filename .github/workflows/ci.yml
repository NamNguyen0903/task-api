
name: Python Backend CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: python -m pytest -v


  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: task-api:ci


  
  publish:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs: [test, docker-build]

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare lowercase image name
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3   
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: publish
    concurrency:
      group: render-task-api-staging
      cancel-in-progress: false

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment: staging

    steps:

      - name: Save current live deployment
        id: baseline
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail

          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "::error::Missing Render API configuration"
            exit 1
          fi

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys?limit=20" \
            -o deploys.json

          GOOD_DEPLOY_ID=$(jq -r '
            [.[] | select((.deploy.status // .status) == "live")
              | (.deploy.id // .id)]
            | if length == 1 then .[0] else empty end
          ' deploys.json)

          if [ -z "$GOOD_DEPLOY_ID" ]; then
            echo "::error::Expected exactly one live deployment"
            exit 1
          fi

          echo "good_deploy_id=$GOOD_DEPLOY_ID" >> "$GITHUB_OUTPUT"
          echo "Saved baseline deployment: $GOOD_DEPLOY_ID"

      
      - name: Verify saved deployment ID
        env:
          GOOD_DEPLOY_ID: ${{ steps.baseline.outputs.good_deploy_id }}
        run: |
          if [ -z "$GOOD_DEPLOY_ID" ]; then
            echo "::error::GOOD_DEPLOY_ID is empty"
            exit 1
          fi

          echo "GOOD_DEPLOY_ID=$GOOD_DEPLOY_ID"
    
      
      - name: Trigger Render deployment
        id: trigger
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE: ghcr.io/namnguyen0903/task-api:sha-${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Missing Render Deploy Hook"
            exit 1
          fi

          curl --fail --silent --show-error \
            --get \
            --data-urlencode "imgURL=$IMAGE" \
            "$RENDER_DEPLOY_HOOK_URL" \
            -o response.json

          NEW_DEPLOY_ID=$(jq -r '.deploy.id // empty' response.json)

          if [ -z "$NEW_DEPLOY_ID" ]; then
            echo "::error::Render did not return a Deploy ID"
            exit 1
          fi

          echo "new_deploy_id=$NEW_DEPLOY_ID" >> "$GITHUB_OUTPUT"
          echo "NEW_DEPLOY_ID=$NEW_DEPLOY_ID"

      - name: Verify deployment IDs
        env:
          GOOD_DEPLOY_ID: ${{ steps.baseline.outputs.good_deploy_id }}
          NEW_DEPLOY_ID: ${{ steps.trigger.outputs.new_deploy_id }}
        run: |
          set -euo pipefail

          echo "GOOD_DEPLOY_ID=$GOOD_DEPLOY_ID"
          echo "NEW_DEPLOY_ID=$NEW_DEPLOY_ID"

          if [ -z "$GOOD_DEPLOY_ID" ] || [ -z "$NEW_DEPLOY_ID" ]; then
            echo "::error::Missing deployment ID"
            exit 1
          fi

          if [ "$GOOD_DEPLOY_ID" = "$NEW_DEPLOY_ID" ]; then
            echo "::error::New deployment ID matches baseline"
            exit 1
          fi

          echo "Deployment IDs verified"

      - name: Monitor Render deployment
        id: monitor
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          NEW_DEPLOY_ID: ${{ steps.trigger.outputs.new_deploy_id }}
        run: |
          set -euo pipefail

          if [ -z "$RENDER_API_KEY" ] || \
             [ -z "$RENDER_SERVICE_ID" ] || \
             [ -z "$NEW_DEPLOY_ID" ]; then
            echo "::error::Missing deployment monitoring configuration"
            exit 1
          fi

          for attempt in $(seq 1 30); do
            curl --fail --silent --show-error \
              --retry 3 \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$NEW_DEPLOY_ID" \
              -o deployment.json

            STATUS=$(jq -r '.status // empty' deployment.json)

            echo "Attempt $attempt/30 — Status: $STATUS"

            case "$STATUS" in
              live)
                echo "deployment_status=live" >> "$GITHUB_OUTPUT"
                echo "Deployment is Live"
                exit 0
                ;;

              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "::error::Deployment ended with status: $STATUS"
                exit 1
                ;;

              created|queued|build_in_progress|pre_deploy_in_progress|update_in_progress)
                sleep 20
                ;;

              *)
                echo "::error::Unexpected status: $STATUS"
                exit 1
                ;;
            esac
          done

          echo "::error::Deployment monitoring timed out"
          exit 1


      - name: Verify deployed application
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          NEW_DEPLOY_ID: ${{ steps.trigger.outputs.new_deploy_id }}
          EXPECTED_IMAGE: ghcr.io/namnguyen0903/task-api:sha-${{ github.sha }}
          HEALTH_URL: https://task-api-sha.onrender.com/health
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$NEW_DEPLOY_ID" \
            -o deployment.json

          STATUS=$(jq -r '.status // empty' deployment.json)
          ACTUAL_IMAGE=$(jq -r '.image.ref // empty' deployment.json)

          echo "Deployment status: $STATUS"
          echo "Expected image: $EXPECTED_IMAGE"
          echo "Actual image: $ACTUAL_IMAGE"

          if [ "$STATUS" != "live" ]; then
            echo "::error::Deployment is not live"
            exit 1
          fi

          if [ "$ACTUAL_IMAGE" != "$EXPECTED_IMAGE" ]; then
            echo "::error::Docker image does not match commit SHA"
            exit 1
          fi

          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error \
              --max-time 20 \
              "$HEALTH_URL" \
              -o health.json &&
              jq -e '.status == "healthy"' health.json > /dev/null; then
              echo "Health check passed"
              exit 0
            fi

            echo "Health check attempt $attempt failed"
            sleep 10
          done

          echo "::error::Health check failed"
          exit 1

      - name: Evaluate rollback decision
        if: ${{ failure() && steps.trigger.outputs.new_deploy_id != '' }}
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          GOOD_DEPLOY_ID: ${{ steps.baseline.outputs.good_deploy_id }}
          NEW_DEPLOY_ID: ${{ steps.trigger.outputs.new_deploy_id }}
        run: |
          set -euo pipefail

          echo "Checking deployment state before rollback..."

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys?limit=20" \
            -o deploys.json

          LIVE_DEPLOY_ID=$(jq -r '
            [.[] | select((.deploy.status // .status) == "live")
              | (.deploy.id // .id)]
            | if length == 1 then .[0] else empty end
          ' deploys.json)

          echo "Previous good: $GOOD_DEPLOY_ID"
          echo "New deployment: $NEW_DEPLOY_ID"
          echo "Currently live: $LIVE_DEPLOY_ID"

          if [ -z "$LIVE_DEPLOY_ID" ]; then
            echo "::warning::Cannot identify a unique live deployment"
            echo "Manual investigation required"

          elif [ "$LIVE_DEPLOY_ID" = "$GOOD_DEPLOY_ID" ]; then
            echo "Previous good deployment is still live"
            echo "No additional rollback required"

          elif [ "$LIVE_DEPLOY_ID" = "$NEW_DEPLOY_ID" ]; then
            echo "::warning::New deployment is live but verification failed"
            echo "Rollback candidate: $GOOD_DEPLOY_ID"
            echo "DRY RUN: No rollback executed"

          else
            echo "::warning::Unexpected live deployment"
            echo "Manual investigation required"
          fi

