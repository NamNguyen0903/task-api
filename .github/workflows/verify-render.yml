
name: Verify Render API

on:
  workflow_dispatch:

jobs:
  verify-render:
    name: Check Render Deployments
    runs-on: ubuntu-latest

    steps:
      - name: Read Render deployments
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail

          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "Missing Render API configuration"
            exit 1
          fi

          echo "Checking Render API..."

          curl --fail --silent --show-error \
            --retry 3 \
            --retry-delay 2 \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Accept: application/json" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys?limit=5" \
            -o deploys.json

          echo "Recent deployments:"

          jq '[.[] | {
            id: (.deploy.id // .id),
            status: (.deploy.status // .status)
          }]' deploys.json

      - name: Verify current live deployment
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail

          GOOD_DEPLOY_ID=$(jq -r '
            [.[] | select(.deploy.status == "live")]
            | first
            | .deploy.id // empty
          ' deploys.json)

          if [ -z "$GOOD_DEPLOY_ID" ]; then
            echo "::error::No live deployment found"
            exit 1
          fi

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$GOOD_DEPLOY_ID" \
            -o live-deploy.json

          jq '{
            id,
            status,
            image: .image.ref
          }' live-deploy.json

          jq -e '.status == "live"' live-deploy.json > /dev/null

          echo "GOOD_DEPLOY_ID=$GOOD_DEPLOY_ID" >> "$GITHUB_ENV"
          echo "Live deployment verified"
